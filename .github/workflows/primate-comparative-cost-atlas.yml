name: primate-comparative-cost-atlas
on:
  push:
    branches: [primate-transition-landscape]
    paths:
      - 'research/primate_comparative_cost/**'
      - '.github/workflows/primate-comparative-cost-atlas.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy openpyxl requests
      - name: Run refined comparative atlas
        run: python research/primate_comparative_cost/refine_cost_atlas_v2.py
      - name: Print refined outputs
        run: |
          echo '=== ATLAS V2 ==='
          cat research/primate_comparative_cost/out_v2/comparative_cost_atlas_v2.csv
          echo '=== IDENTIFICATION MATRIX ==='
          cat research/primate_comparative_cost/out_v2/identification_matrix_v2.csv
          echo '=== AUDIT ==='
          cat research/primate_comparative_cost/out_v2/audit_v2.json
      - name: Upload comparative atlas v2
        uses: actions/upload-artifact@v4
        with:
          name: primate-comparative-cost-atlas-v2
          path: research/primate_comparative_cost/out_v2/
          if-no-files-found: error
