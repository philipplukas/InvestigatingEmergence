name: primate-comparative-cost-atlas
on:
  push:
    branches: [primate-transition-landscape]
    paths:
      - 'research/primate_comparative_cost/**'
      - '.github/workflows/primate-comparative-cost-atlas.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy openpyxl requests
      - name: Discover and analyze public comparative datasets
        run: python research/primate_comparative_cost/discover_and_analyze.py
      - name: Print outputs
        run: |
          echo '=== LEDGER ==='
          cat research/primate_comparative_cost/out/comparative_cost_ledger_v1.csv
          echo '=== DISCOVERY ==='
          cat research/primate_comparative_cost/out/discovery.json
      - name: Upload comparative atlas
        uses: actions/upload-artifact@v4
        with:
          name: primate-comparative-cost-atlas
          path: research/primate_comparative_cost/out/
          if-no-files-found: error
