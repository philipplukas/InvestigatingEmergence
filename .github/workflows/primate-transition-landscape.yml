name: primate-transition-landscape
on:
  push:
    branches: [primate-transition-landscape]
    paths:
      - 'research/primate_transition/**'
      - '.github/workflows/primate-transition-landscape.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy
      - name: Run joint landscape analysis
        run: python research/primate_transition/joint_landscape.py
      - name: Run blocked list-level validation
        run: python research/primate_transition/joint_landscape_cv_fast.py
      - name: Print joint landscape results
        run: |
          echo '=== JOINT MODEL COMPARISON ==='
          cat research/primate_transition/out_joint/joint_model_comparison.csv
          echo '=== BLOCKED CV ==='
          cat research/primate_transition/out_joint/blocked_cv_model_comparison.csv
          echo '=== BLOCKED CV BY SUBJECT ==='
          cat research/primate_transition/out_joint/blocked_cv_by_subject.csv
          echo '=== STATE SPACE SUPPORT ==='
          cat research/primate_transition/out_joint/state_space_support.csv
          echo '=== BASIN ENERGIES ==='
          cat research/primate_transition/out_joint/empirical_basin_energies.csv
          echo '=== BARRIER PROXIES ==='
          cat research/primate_transition/out_joint/transition_barrier_proxies.csv
          echo '=== PHASE SHIFT ALIGNMENT ==='
          cat research/primate_transition/out_joint/phase_shift_alignment.csv
          echo '=== SUMMARY ==='
          cat research/primate_transition/out_joint/joint_summary.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: primate-joint-landscape-results
          path: research/primate_transition/out_joint/
          if-no-files-found: error
