name: primate-transition-landscape
on:
  push:
    branches: [primate-transition-landscape]
    paths:
      - 'research/primate_transition/**'
      - '.github/workflows/primate-transition-landscape.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy
      - name: Run joint landscape analysis
        run: python research/primate_transition/joint_landscape.py
      - name: Run blocked list-level validation
        run: python research/primate_transition/joint_landscape_cv_fast.py
      - name: Run cross-species landscape analysis
        run: python research/primate_transition/cross_species_landscape.py
      - name: Print joint landscape results
        run: |
          echo '=== JOINT MODEL COMPARISON ==='
          cat research/primate_transition/out_joint/joint_model_comparison.csv
          echo '=== BLOCKED CV ==='
          cat research/primate_transition/out_joint/blocked_cv_model_comparison.csv
          echo '=== COHORT LANDSCAPE SUMMARY ==='
          cat research/primate_transition/out_cross_species/cohort_landscape_summary.csv
          echo '=== CODING AUDIT ==='
          cat research/primate_transition/out_cross_species/coding_mismatch_audit.csv
          echo '=== CLUSTER BOOTSTRAP COMPARISONS ==='
          cat research/primate_transition/out_cross_species/cluster_bootstrap_comparisons.csv
          echo '=== CHILD AGE MODELS ==='
          cat research/primate_transition/out_cross_species/child_age_models.csv
          echo '=== CROSS SPECIES SUMMARY ==='
          cat research/primate_transition/out_cross_species/cross_species_summary.json
      - name: Upload joint artifacts
        uses: actions/upload-artifact@v4
        with:
          name: primate-joint-landscape-results
          path: research/primate_transition/out_joint/
          if-no-files-found: error
      - name: Upload cross-species artifacts
        uses: actions/upload-artifact@v4
        with:
          name: primate-cross-species-landscape-results
          path: research/primate_transition/out_cross_species/
          if-no-files-found: error
