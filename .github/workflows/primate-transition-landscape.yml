name: primate-transition-landscape
on:
  push:
    branches: [primate-transition-landscape]
    paths:
      - 'research/primate_transition/**'
      - 'research/primate_comparative_cost/**'
      - '.github/workflows/primate-transition-landscape.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy openpyxl requests
      - name: Run joint landscape analysis
        run: python research/primate_transition/joint_landscape.py
      - name: Run blocked list-level validation
        run: python research/primate_transition/joint_landscape_cv_fast.py
      - name: Run cross-species landscape analysis
        run: python research/primate_transition/cross_species_landscape.py
      - name: Audit published human subsets
        run: python research/primate_transition/audit_published_subset.py
      - name: Run published two-coordinate test
        run: python research/primate_transition/published_two_coordinate.py
      - name: Run comparative cost atlas
        run: python research/primate_comparative_cost/discover_and_analyze.py
      - name: Print decisive results
        run: |
          echo '=== PUBLISHED TWO COORDINATE ==='
          cat research/primate_transition/out_published/published_two_coordinate_summary.csv
          echo '=== PUBLISHED PAIRWISE TESTS ==='
          cat research/primate_transition/out_published/published_pairwise_tests.csv
          echo '=== CHILD AGE PERMUTATION TESTS ==='
          cat research/primate_transition/out_published/child_age_permutation_tests.csv
          echo '=== COMPARATIVE COST LEDGER ==='
          cat research/primate_comparative_cost/out/comparative_cost_ledger_v1.csv
          echo '=== COMPARATIVE DISCOVERY ==='
          cat research/primate_comparative_cost/out/discovery.json
      - name: Upload published analysis
        uses: actions/upload-artifact@v4
        with:
          name: primate-published-two-coordinate-results
          path: research/primate_transition/out_published/
          if-no-files-found: error
      - name: Upload joint artifacts
        uses: actions/upload-artifact@v4
        with:
          name: primate-joint-landscape-results
          path: research/primate_transition/out_joint/
          if-no-files-found: error
      - name: Upload cross-species artifacts
        uses: actions/upload-artifact@v4
        with:
          name: primate-cross-species-landscape-results
          path: research/primate_transition/out_cross_species/
          if-no-files-found: error
      - name: Upload comparative cost atlas
        uses: actions/upload-artifact@v4
        with:
          name: primate-comparative-cost-atlas
          path: research/primate_comparative_cost/out/
          if-no-files-found: error
